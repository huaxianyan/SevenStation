[package]
name = "sevenstation-control"
version = "0.5.9"
description = "Seven Station 中心控制台"
edition = "2021"
rust-version = "1.88"

# Cargo 的 crate 名不允许带点，所以产物是 sevenstation-control.exe，
# 打包时改名为 SevenStation.Control.exe（和 SevenStation.Core.exe 对齐）。
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
