[package]
name = "sevenstation-desktop"
version = "0.5.6"
description = "Seven Station 桌面客户端"
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "SevenStation"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
time = { version = "0.3", features = ["formatting", "local-offset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 安装程序把中心地址与令牌写进 HKLM，客户端启动时先读它。

[profile.release]
codegen-units = 1
lto = true
strip = true
